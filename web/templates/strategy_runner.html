<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略运行 - A股量化选股系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/khunter.css">
</head>
<body>
    <div class="container-fluid">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="/static/images/logo.svg" alt="Logo" height="30">
                    A股量化选股系统
                </a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/">首页</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/selection">选股</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/strategies">策略管理</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/strategy-runner">策略运行</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/backtest">回测</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/ranking">排名</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- 主要内容 -->
        <div class="content">
            <h1 class="page-title">策略运行</h1>
            
            <!-- 运行控制区域 -->
            <div class="card mb-4">
                <div class="card-header">
                    运行控制
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="strategy-list" class="form-label">选股策略</label>
                                <div id="strategy-list" class="form-check-list">
                                    <!-- 策略列表将通过JS动态加载 -->
                                </div>
                                <div class="mt-2">
                                    <button id="select-all-strategies" class="btn btn-sm btn-secondary">全选</button>
                                    <button id="deselect-all-strategies" class="btn btn-sm btn-secondary">取消全选</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="timing-strategy" class="form-label">择时策略</label>
                                <select id="timing-strategy" class="form-select">
                                    <!-- 择时策略将通过JS动态加载 -->
                                </select>
                            </div>
                            <button id="run-strategy-btn" class="btn btn-primary">开始运行</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 今日状态 -->
            <div id="strategy-status" class="card mb-4">
                <!-- 状态信息将通过JS动态加载 -->
            </div>
            
            <!-- 统计卡片 -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">持仓数量</h5>
                            <p class="card-text" id="position-count">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">可用资金</h5>
                            <p class="card-text" id="available-cash">¥0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">总资产</h5>
                            <p class="card-text" id="total-assets">¥0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h5 class="card-title">持仓盈亏</h5>
                            <p class="card-text" id="portfolio-profit">0%</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 股票池 -->
            <div class="card mb-4">
                <div class="card-header">
                    股票池（用于择时）
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>评分</th>
                                    <th>状态</th>
                                    <th>入池天数</th>
                                    <th>现价</th>
                                    <th>支撑位</th>
                                </tr>
                            </thead>
                            <tbody id="pool-list">
                                <!-- 股票池列表将通过JS动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 持仓概览 -->
            <div class="card mb-4">
                <div class="card-header">
                    持仓概览
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>持仓</th>
                                    <th>成本</th>
                                    <th>现价</th>
                                    <th>盈亏额</th>
                                    <th>盈亏%</th>
                                    <th>持有天</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="portfolio-list">
                                <!-- 持仓列表将通过JS动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 今日信号 -->
            <div class="card mb-4">
                <div class="card-header">
                    今日信号
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>类型</th>
                                    <th>代码</th>
                                    <th>名称</th>
                                    <th>价格</th>
                                    <th>数量</th>
                                    <th>原因</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="signals-list">
                                <!-- 信号列表将通过JS动态加载 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部信息 -->
    <footer class="footer">
        <div class="container">
            <p class="text-center">© 2026 A股量化选股系统 - 策略运行模块</p>
        </div>
    </footer>

    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        // 加载策略运行模块
        import StrategyRunnerModule from '/static/js/modules/strategy-runner.js';
        
        // 初始化策略运行模块
        document.addEventListener('DOMContentLoaded', function() {
            StrategyRunnerModule.initStrategyRunnerModule();
        });
        
        // 暴露全局函数
        window.viewStockDetail = function(stockCode) {
            // 跳转到股票详情页面
            window.location.href = `/stock/${stockCode}`;
        };
    </script>
</body>
</html>
